<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="A brand color changes once, in Primitives, and flows to every component" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="760" height="270" rx="16" fill="#111318"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b90a0"/>
    </marker>
  </defs>
  <text x="24" y="38" font-size="16" font-weight="600" fill="#ffffff">A brand color changes once, in Primitives, and flows to every component</text>
  <text x="24" y="60" font-size="12" fill="#a3a8b8">FY25 token architecture in Figma variables. Each tier references the one before it.</text>

  <g fill="none" stroke="#8b90a0" stroke-width="1.25">
    <path d="M224 166H274" marker-end="url(#arrow)"/>
    <path d="M476 166H526" marker-end="url(#arrow)"/>
  </g>

  <rect x="24" y="88" width="200" height="156" rx="10" fill="rgba(168,85,247,0.14)" stroke="rgb(168,85,247)" stroke-width="2"/>
  <text x="38" y="114" font-size="14" font-weight="600" fill="#ffffff">Primitives</text>
  <text x="38" y="134" font-size="13" fill="#a3a8b8">168 tokens</text>
  <text x="38" y="160" font-size="12" fill="#e6e8ef">Raw values</text>
  <text x="38" y="177" font-size="12" fill="#e6e8ef">Color family + scale step</text>
  <text x="38" y="194" font-size="12" fill="#e6e8ef">Spacing, type, radius</text>
  <text x="38" y="216" font-size="12" fill="#a3a8b8">Spacing and radius follow</text>
  <text x="38" y="233" font-size="12" fill="#a3a8b8">Tailwind's scales</text>

  <rect x="276" y="88" width="200" height="156" rx="10" fill="none" stroke="#5b6070" stroke-width="1.25"/>
  <text x="290" y="114" font-size="14" font-weight="600" fill="#ffffff">Semantic</text>
  <text x="290" y="134" font-size="13" fill="#a3a8b8">400 tokens</text>
  <text x="290" y="160" font-size="12" fill="#e6e8ef">Roles, not values</text>
  <text x="290" y="177" font-size="12" fill="#e6e8ef">surface, text, border, icon</text>
  <text x="290" y="194" font-size="12" fill="#e6e8ef">Light and dark modes</text>

  <rect x="528" y="88" width="208" height="156" rx="10" fill="none" stroke="#5b6070" stroke-width="1.25"/>
  <text x="542" y="114" font-size="14" font-weight="600" fill="#ffffff">Component</text>
  <text x="542" y="134" font-size="13" fill="#a3a8b8">520 tokens</text>
  <text x="542" y="160" font-size="12" fill="#e6e8ef">Values for one component,</text>
  <text x="542" y="177" font-size="12" fill="#e6e8ef">such as buttons</text>
  <text x="542" y="194" font-size="12" fill="#e6e8ef">Used by the 42 components</text>
</svg>
