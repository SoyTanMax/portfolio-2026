<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Epicor FY25 Design System" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#1f2330"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- three tiers as stacked layers -->
  <g transform="translate(430 270)">
    <rect x="-230" y="-40" width="300" height="190" rx="18" fill="none" stroke="#4b5060" stroke-width="2"/>
    <rect x="-180" y="-90" width="300" height="190" rx="18" fill="none" stroke="#6b7080" stroke-width="2"/>
    <rect x="-130" y="-140" width="300" height="190" rx="18" fill="rgba(168,85,247,0.16)" stroke="rgb(168,85,247)" stroke-width="2.5"/>
    <text x="-110" y="-104" font-size="18" font-weight="600" fill="#ffffff">Primitives · 168</text>
    <text x="-160" y="80" font-size="18" font-weight="600" fill="#c9ccd6">Semantic · 400</text>
    <text x="-210" y="130" font-size="18" font-weight="600" fill="#9ca1b0">Component · 520</text>
    <g transform="translate(-110 -78)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#053c55"/>
      <rect x="42" y="0" width="34" height="34" rx="8" fill="#317d9b"/>
      <rect x="84" y="0" width="34" height="34" rx="8" fill="#049e8a"/>
      <rect x="126" y="0" width="34" height="34" rx="8" fill="#ff8873"/>
      <rect x="168" y="0" width="34" height="34" rx="8" fill="#edf2f5"/>
    </g>
  </g>

  <text x="400" y="530" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">FY25 Design System</text>
  <text x="400" y="560" text-anchor="middle" font-size="16" fill="#a3a8b8">Token architecture · Epicor</text>
</svg>
